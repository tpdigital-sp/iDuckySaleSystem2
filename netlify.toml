# Netlify config — Next.js 15 (SSR) + Supabase + firebase-admin
# ประกาศ @netlify/plugin-nextjs ตรง ๆ (ไม่พึ่ง auto-detect)
# ปลั๊กอินจะแปลง .next เป็น Serverless/Edge Functions ให้ SSR + API routes ทำงาน
#
# publish = ".next" ต้องกำหนดในไฟล์นี้ เพื่อ "ทับ" ค่าใน Dashboard UI
# (UI ตั้งไว้เป็นรากโปรเจกต์ /opt/build/repo → plugin fail เพราะ publish = base dir)
# เมื่อมี plugin ประกาศชัด plugin จะจัดการ .next ให้ถูก (ไม่เสิร์ฟดิบจน 404)

[build]
  command = "next build"
  publish = ".next"
  # ═══ push แล้ว "ไม่ต้อง" ขึ้นเว็บจริงอัตโนมัติ — สั่งเองเมื่อพร้อมเท่านั้น ═══
  #
  # ทำไม: เครดิต build มีจำกัด (ครั้งละ ~2-4 นาที) วันที่ 11 ส.ค. 2026 push 15 ครั้งในเช้าเดียว
  # จนเครดิตหมด ("Skipped due to account credit usage exceeded") แล้วขึ้นเว็บไม่ได้เลยทั้งวัน
  # ตกลงกันใหม่: คอมมิตงานได้ตามปกติ (โค้ดเก็บขึ้น GitHub ทุกครั้ง) แต่ "ขึ้นเว็บจริง" เจ้าของสั่งเอง
  #
  # 🚀 วิธีสั่งขึ้นเว็บจริง — เลือกทางไหนก็ได้:
  #   1. ใส่ [deploy] ไว้ในข้อความคอมมิต (บรรทัดไหนก็ได้) ของคอมมิตล่าสุดที่ push ขึ้นไป
  #      เช่น  git commit -m "แก้ราคาตัวเลือก [deploy]"
  #      ⚠️ push ทีเดียวหลายคอมมิต Netlify ดูแค่คอมมิตบนสุด — ต้องใส่ที่คอมมิตสุดท้าย
  #   2. กดปุ่ม "Trigger deploy" บนหน้า Netlify (คอมมิตเดิมก็สั่งซ้ำได้)
  #   3. สั่งจากเครื่อง: netlify api createSiteBuild --data '{"site_id":"f6a9e5dd-bd3d-4a50-94a8-d9fe115e86ef"}'
  #
  # กติกาของสคริปต์ข้างล่าง: ออก 0 = ข้าม build · ออก 1 = build ต่อ
  #   บรรทัด 1 = กด Trigger deploy เอง (ไม่มีแคช/คอมมิตเดิม) → build เสมอ
  #   บรรทัด 2 = ข้อความคอมมิตมี [deploy] → build
  #   บรรทัด 3 = นอกนั้นข้ามหมด (push ธรรมดาไม่กินเครดิต)
  ignore = "if [ -z \"$CACHED_COMMIT_REF\" ] || [ -z \"$COMMIT_REF\" ] || [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; then exit 1; fi; if git log -1 --pretty=%B \"$COMMIT_REF\" | grep -qi '\\[deploy\\]'; then exit 1; fi; exit 0"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
