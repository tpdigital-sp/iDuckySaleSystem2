<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="m.css">
<style>
  .orb1{width:260px;height:260px;left:-90px;top:-110px;background:radial-gradient(circle at 38% 38%,#EEF8FF,#DCF0FD 58%,rgba(220,240,253,0))}
  .orb2{width:230px;height:230px;right:-70px;bottom:-110px;background:radial-gradient(circle at 40% 40%,#E4F6EC,#D3F0E0 58%,rgba(255,255,255,0));opacity:.8}
  .bn-in{padding:20px 18px 0}
  .left{width:190px;gap:7px}
  .badge.tg{background:linear-gradient(135deg,#66C59A,#3FA477);color:#fff}
  h1{font-size:21px;line-height:1.28;white-space:nowrap}
  .sub{font-size:11px}
  .pr{font-family:var(--display);font-weight:600;font-size:20px;color:var(--blue-deep);line-height:1}
  .pr small{font-weight:500;font-size:11px;color:var(--navy-soft);margin-right:4px}
  .cta{font-size:13px;padding:6px 7px 7px 14px} .cta .dot{width:21px;height:21px;font-size:12px}
  .main{position:absolute;right:14px;top:18px;width:158px;height:220px;padding:5px;rotate:2deg}
  .main img{width:100%;height:100%;object-fit:cover;display:block;border-radius:12px;object-position:50% 50%}
</style>
<div class="bn">
  <span class="orb orb1"></span><span class="orb orb2"></span>
  <div class="bn-in">
    <div class="left">
      <span class="badge tg">🌱 ทนแดด</span>
      <h1>สติ๊กเกอร์<br>Solvent Premium</h1>
      <p class="sub">ติดแน่น ทนน้ำ ทนแดด</p>
      <span class="pr"><small>เริ่ม</small>฿130</span>
      <span class="cta">สั่งเลย<span class="dot">→</span></span>
    </div>
  </div>
  <div class="card main"><img src="https://upvigfvxloelzevwneof.supabase.co/storage/v1/object/public/product-images/products/sticker-solvent/11678ac8-a21d-4e43-8ef7-eea0e7f27c35.jpg"></div>
</div>
