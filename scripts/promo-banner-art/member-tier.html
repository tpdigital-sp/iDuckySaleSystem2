<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  .bn{background:linear-gradient(118deg,#EEF7FF 0%,#F8FCFF 40%,#FFFFFF 66%,#FFFCF2 100%)}
  .left{width:46%}
  .bn-in{padding-left:214px}
  .orb1{width:420px;height:420px;left:-140px;bottom:-190px;background:radial-gradient(circle at 40% 40%,#EAF6FF,#D9EEFC 58%,rgba(217,238,252,0))}
  .orb2{width:340px;height:340px;right:-60px;top:-150px;background:radial-gradient(circle at 40% 40%,#FFF8E2,#FFF1CB 58%,rgba(255,241,203,0));opacity:.8}
  .c1{width:120px;left:420px;top:20px;opacity:.45}
  .ladder{position:absolute;right:-6px;top:96px;display:flex;align-items:flex-end;gap:11px}
  .rk{width:95px;position:relative;padding:30px 6px 14px;text-align:center}
  .rk img{position:absolute;left:50%;translate:-50% 0;top:-24px;width:46px;filter:drop-shadow(0 6px 10px rgba(44,129,196,.2))}
  .rk b{display:block;font-family:var(--display);font-weight:600;font-size:25px;line-height:1.15;color:var(--navy)}
  .rk .nm{font-family:var(--display);font-weight:500;font-size:13px;color:var(--blue-deep);margin-top:1px}
  .rk small{display:block;font-size:12.5px;color:var(--navy-soft);margin-top:3px}
  .rk.top{background:linear-gradient(160deg,#fff,#FFFDF4);border-color:var(--yolk)}
  .duck1{left:16px;bottom:-2px;width:176px}
  .n1{right:2px;bottom:26px}
</style>
<div class="bn">
  <span class="orb orb1"></span><span class="orb orb2"></span>
  <img class="cloud c1" src="../../public/landing/cloud.webp">
  <div class="bn-in">
    <div class="left">
      <span class="badge">สิทธิ์สมาชิก iDucky</span>
      <h1>ยิ่งสั่งสะสม<br>ยิ่งลดสูงสุด <span class="hl"><span>10%</span></span></h1>
      <p class="sub">ยอดสะสมครบ ฿50,000 เริ่มลด 3% อัตโนมัติ</p>
      <span class="cta">ดูสิทธิ์ของฉัน<span class="dot">→</span></span>
    </div>
    <div class="right">
      <div class="ladder">
        <div class="card rk"><img src="../../public/account/rank/bronze-ico.webp"><b>3%</b><div class="nm">Bronze</div><small>฿50,000</small></div>
        <div class="card rk"><img src="../../public/account/rank/silver-ico.webp"><b>5%</b><div class="nm">Silver</div><small>฿150,000</small></div>
        <div class="card rk"><img src="../../public/account/rank/gold-ico.webp"><b>7%</b><div class="nm">Gold</div><small>฿350,000</small></div>
        <div class="card rk"><img src="../../public/account/rank/platinum-ico.webp"><b>8%</b><div class="nm">Platinum</div><small>฿600,000</small></div>
        <div class="card rk top"><img src="../../public/account/rank/diamond-ico.webp"><b>10%</b><div class="nm">Diamond</div><small>฿900,000</small></div>
      </div>
      <span class="note n1">*ล็อกอินก่อนสั่งซื้อ ระบบจึงนับยอดสะสมให้</span>
    </div>
  </div>
  <img class="duck duck1" src="../../public/landing/duck-hug.webp">
</div>
