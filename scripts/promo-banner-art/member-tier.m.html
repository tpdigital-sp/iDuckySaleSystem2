<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="m.css">
<style>
  .bn{background:linear-gradient(150deg,#EEF7FF 0%,#F8FCFF 44%,#FFFFFF 70%,#FFFCF2 100%)}
  .orb1{width:250px;height:250px;left:-90px;bottom:-120px;background:radial-gradient(circle at 40% 40%,#EAF6FF,#D9EEFC 58%,rgba(217,238,252,0))}
  .orb2{width:220px;height:220px;right:-70px;top:-100px;background:radial-gradient(circle at 40% 40%,#FFF8E2,#FFF1CB 58%,rgba(255,241,203,0));opacity:.8}
  .c1{width:70px;right:100px;top:10px;opacity:.4}
  .left{width:70%}
  .duck1{right:4px;top:38px;width:88px}
  .ladder{position:absolute;left:50%;translate:-50% 0;bottom:13px;display:flex;gap:5px}
  .rk{width:64px;padding:15px 3px 8px;text-align:center}
  .rk img{position:absolute;left:50%;translate:-50% 0;top:-13px;width:28px;filter:drop-shadow(0 4px 7px rgba(44,129,196,.22))}
  .rk b{display:block;font-family:var(--display);font-weight:600;font-size:17px;line-height:1.1;color:var(--navy)}
  .rk .nm{font-family:var(--display);font-weight:500;font-size:9.5px;color:var(--blue-deep)}
  .rk.top{background:linear-gradient(160deg,#fff,#FFFDF4);border-color:var(--yolk)}
</style>
<div class="bn">
  <span class="orb orb1"></span><span class="orb orb2"></span>
  <img class="cloud c1" src="../../public/landing/cloud.webp">
  <img class="duck duck1" src="../../public/landing/duck-hug.webp">
  <div class="bn-in">
    <div class="left">
      <span class="badge">สิทธิ์สมาชิก iDucky</span>
      <h1>ยิ่งสั่งสะสม<br>ยิ่งลดสูงสุด <span class="hl"><span>10%</span></span></h1>
      <span class="cta">ดูสิทธิ์ของฉัน<span class="dot">→</span></span>
    </div>
  </div>
  <div class="ladder">
    <div class="card rk"><img src="../../public/account/rank/bronze-ico.webp"><b>3%</b><div class="nm">Bronze</div></div>
    <div class="card rk"><img src="../../public/account/rank/silver-ico.webp"><b>5%</b><div class="nm">Silver</div></div>
    <div class="card rk"><img src="../../public/account/rank/gold-ico.webp"><b>7%</b><div class="nm">Gold</div></div>
    <div class="card rk"><img src="../../public/account/rank/platinum-ico.webp"><b>8%</b><div class="nm">Platinum</div></div>
    <div class="card rk top"><img src="../../public/account/rank/diamond-ico.webp"><b>10%</b><div class="nm">Diamond</div></div>
  </div>
</div>
