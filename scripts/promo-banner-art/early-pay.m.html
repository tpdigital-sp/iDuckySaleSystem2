<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="m.css">
<style>
  .orb1{width:250px;height:250px;left:-90px;top:-110px;background:radial-gradient(circle at 38% 38%,#FFF7DE,#FFF0C6 58%,rgba(255,240,198,0));opacity:.8}
  .orb2{width:230px;height:230px;right:-70px;bottom:-110px;background:radial-gradient(circle at 40% 40%,#EAF6FF,#D7EEFC 58%,rgba(215,238,252,0))}
  .c1{width:70px;right:104px;top:10px;opacity:.4}
  .left{width:70%}
  .duck1{right:0;top:44px;width:106px}
  .pair{position:absolute;left:50%;translate:-50% 0;bottom:13px;display:flex;gap:9px}
  .pc{width:163px;padding:9px 10px;display:flex;align-items:center;gap:9px;text-align:left}
  .pc b{font-family:var(--display);font-weight:600;font-size:23px;line-height:1;color:var(--navy)}
  .pc small{display:block;font-size:10.5px;line-height:1.35;color:var(--navy-soft)}
  .pc .t{font-family:var(--display);font-weight:500;font-size:11px;color:var(--blue-deep);display:block;margin-bottom:1px}
</style>
<div class="bn">
  <span class="orb orb1"></span><span class="orb orb2"></span>
  <img class="cloud c1" src="../../public/landing/cloud.webp">
  <img class="duck duck1" src="../../public/account/coupon-duck.webp">
  <div class="bn-in">
    <div class="left">
      <span class="badge">ส่วนลดโอนไว</span>
      <h1>โอนภายใน 1 ชม.<br>ลดเพิ่มสูงสุด <span class="hl"><span>฿10</span></span></h1>
      <span class="cta">สั่งเลย<span class="dot">→</span></span>
    </div>
  </div>
  <div class="pair">
    <div class="card pc"><b>฿5</b><span><span class="t">ลดเพิ่ม</span><small>ยอดสินค้า<br>ไม่เกิน ฿999</small></span></div>
    <div class="card pc"><b>฿10</b><span><span class="t">ลดเพิ่ม</span><small>ยอดสินค้า<br>฿1,000 ขึ้นไป</small></span></div>
  </div>
</div>
